name: 看门狗心跳

on:
  # 北京 09:03/11:03/13:03/15:03/17:03 各巡一次（GitHub schedule 会飘移/偶发丢弃，
  # 但每小时级心跳全灭的概率趋近于零）。主推送链路：本地任务 08:20 + daily.yml 自带 schedule 08:43/11:23。
  schedule:
    - cron: "3 1,3,5,7,9 * * *"
  workflow_dispatch:

# 心跳职责：检查当日日报是否已生成，没有就用 GITHUB_TOKEN dispatch 主 workflow 补发。
# daily.yml 防重护栏保证同一天只推一次；若某次生成失败，下一心跳会自动再试。
jobs:
  patrol:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检查今日日报是否已生成
        id: check
        run: |
          git clone --depth 1 --single-branch https://github.com/${GITHUB_REPOSITORY}.git repo-check
          cd repo-check
          TODAY=$(TZ='Asia/Shanghai' date +%F)
          if git cat-file -e "origin/main:output/daily-${TODAY}.png" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "今日日报 daily-${TODAY}.png 已存在，无需补发"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "今日日报尚未生成，触发主 workflow 补发"
          fi

      - name: 触发主 workflow 补发
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "已 dispatch daily.yml（心跳补发）"
